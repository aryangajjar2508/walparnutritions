<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Walpar Formulation Intelligence Platform</title>
    <!-- Compiled Tailwind CSS (Instant load, works 100% offline & online) -->
    <link rel="stylesheet" href="/static/css/tailwind.min.css?v=20260930_css1">
    <!-- Local & CDN Fallback for dynamic scripts -->
    <script src="/static/js/tailwind.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/static/js/lucide.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        walpar: {
                            50: '#f0fdf9',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                            950: '#042f2e',
                        }
                }
            }
        };
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-walpar-950 to-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-100">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/15 rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
        
        <!-- Subtle Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-teal-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Brand Header -->
        <div class="text-center mb-8 relative">
            <div class="w-16 h-16 bg-gradient-to-tr from-teal-500 to-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-teal-500/30">
                <i data-lucide="shield-check" class="w-9 h-9 text-slate-950 stroke-[2.2]"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">WALPAR</h1>
            <p class="text-xs uppercase tracking-widest text-teal-400 font-semibold mt-0.5">Formulation Intelligence Platform</p>
            <div class="mt-3 inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[11px] text-slate-300 font-mono">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-teal-400"></i>
                <span id="live-ist-clock">Loading IST...</span>
            </div>
        </div>

        <!-- Error Alert -->
        {% if error %}
        <div class="mb-5 p-3.5 bg-rose-500/20 border border-rose-500/40 rounded-xl text-rose-200 text-xs flex items-center space-x-2">
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/api/auth/login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center justify-between">
                    <span>User ID / Username</span>
                    <span class="text-[10px] text-slate-400">Case-insensitive</span>
                </label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5 pointer-events-none"></i>
                    <input type="text" name="username" required autofocus placeholder="Enter your User ID" 
                           class="w-full bg-white/5 border border-white/15 focus:border-teal-400 focus:bg-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5 pointer-events-none"></i>
                    <input type="password" name="password" id="login-password" required placeholder="Enter password" 
                           class="w-full bg-white/5 border border-white/15 focus:border-teal-400 focus:bg-white/10 rounded-xl py-2.5 pl-10 pr-10 text-sm text-white placeholder-slate-500 outline-none transition">
                    <button type="button" onclick="togglePasswordVis()" class="absolute right-3 top-3 text-slate-400 hover:text-white">
                        <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button type="submit" 
                    class="w-full mt-2 py-3 bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-slate-950 font-bold rounded-xl text-sm shadow-lg shadow-teal-500/25 transition active:scale-[0.98] flex items-center justify-center space-x-2">
                <span>Sign In to Platform</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Footer Notice -->
        <div class="mt-8 text-center text-[11px] text-slate-400 border-t border-white/10 pt-4">
            <p>Protected Corporate System • Authorized Personnel Only</p>
            <p class="mt-1 text-[10px] text-slate-400">All access attempts &amp; formula scans are logged in IST timezone.</p>
        </div>

    </div>

    <script>
        if (window.lucide && typeof lucide.createIcons === 'function') {
            lucide.createIcons();
        }

        function togglePasswordVis() {
            const inp = document.getElementById('login-password');
            const icon = document.getElementById('eye-icon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                inp.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Live IST Clock
        function updateISTClock() {
            const now = new Date();
            const istString = now.toLocaleString("en-IN", {
                timeZone: "Asia/Kolkata",
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            });
            const el = document.getElementById('live-ist-clock');
            if (el) el.innerText = `${istString} IST`;
        }
        setInterval(updateISTClock, 1000);
        updateISTClock();
    </script>
</body>
</html>
