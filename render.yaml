services:
  - type: web
    name: walpar-ocr
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: GEMINI_API_KEY
        sync: false
      - key: WALPAR_SECRET_KEY
        generateValue: true
      - key: PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK
        value: "True"
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
